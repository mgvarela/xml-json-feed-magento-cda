name: Sincronizar Pricing (Cada 1 Hora)

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-snapshot
  cancel-in-progress: false

jobs:
  run-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar API Pricing Vercel
        env:
          MY_SECRET_TOKEN: ${{ secrets.API_SECRET_TOKEN }}
        run: |
          curl -fsS --max-time 120 -X GET "https://xml-json-feed-magento-cda.vercel.app/api/feed?mode=pricing" \
          -H "Authorization: Bearer $MY_SECRET_TOKEN"
